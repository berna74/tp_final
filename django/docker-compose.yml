
services:
  backend:
    image: backend:0.5
    build:
      context: ./config
      dockerfile: django-image/Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./src/dyango:/usr/src/app:delegated
    environment:  
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - postgres
    ports:
      - 8000:8000
    networks:
      - red
  postgres:
    image: postgres:16-bullseye
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DJANGO_SU_NAME: ${DJANGO_SU_NAME}
      DJANGO_SU_EMAIL: ${DJANGO_SU_EMAIL}
      DJANGO_SU_PASSWORD: ${DJANGO_SU_PASSWORD}
    volumes:
      - ./data:/var/lib/postgresql/data:delegated
    ports:
      - ${DB_PORT}:5432
    networks:
      - red

networks:
  red:
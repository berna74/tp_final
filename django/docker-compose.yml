
services:
  backend:
    image: backend:0.2
    build:
      context: ./config
      dockerfile: django-image/Dockerfile
    volumes:
      - ./src/dyango:/usr/src/app:delegated
    environment:  
      DB_HOST: ${DB_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 8000:8000
    networks:
      - red
  postgres:
    image: postgres:16-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data:/var//lib/postgresql/data:delegated
    ports:
      - ${DB_PORT}:5432
    networks:
      - red

networks:
  red: